[package]
name = "vault-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
default = []
dev-vault = ["dep:tempfile", "dep:getrandom"]

[dependencies]
vault-core = { path = "../vault-core" }
vault-app = { path = "../vault-app" }
vault-storage = { path = "../vault-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "~1.18.1"
zeroize = "1.8"
tempfile = { version = "3", optional = true }
getrandom = { version = "0.3", optional = true }

[[bin]]
name = "browser-harness"
path = "src/bin/browser-harness.rs"
required-features = ["dev-vault"]
