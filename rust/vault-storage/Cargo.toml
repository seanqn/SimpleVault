[package]
name = "vault-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
vault-core = { path = "../vault-core" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zeroize = "1.8"
thiserror = "2"
tempfile = "3"

argon2 = "0.5"
chacha20poly1305 = "0.10"
uuid = { version = "~1.18.1", features = ["v4"] }
